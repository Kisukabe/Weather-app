[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-mlops"
version = "2.0.0"
description = "Hệ thống MLOps Hiệu chỉnh Sai số Dự báo Thời tiết TP.HCM (Kiến trúc Module hóa & Multi-Model)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kisukabe" }
]
dependencies = [
    "pyspark>=3.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "joblib>=1.4.0",
    "python-box>=7.0.0",
    "ensure>=1.0.4",
    "PyYAML>=6.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.0.0",
    "apscheduler>=3.10.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"
