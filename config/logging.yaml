version: 1
disable_existing_loggers: false
formatters:
  simple:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    level: INFO
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: simple
    level: INFO
    filename: logs/app.log
    maxBytes: 10485760 # 10 MB per file
    backupCount: 5     # Max 5 backup files = 50 MB total retention
    encoding: utf-8

loggers:
  weather_predictor:
    handlers: [console, file]
    level: INFO
    propagate: false

root:
  handlers: [console, file]
  level: INFO
